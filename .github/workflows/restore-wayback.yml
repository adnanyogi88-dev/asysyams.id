name: Restore archived Asy-Syams website

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-wayback.yml
      - scripts/restore_wayback.py
  workflow_dispatch:
    inputs:
      workers:
        description: Number of simultaneous Wayback downloads
        required: false
        default: '14'

permissions:
  contents: write

concurrency:
  group: restore-asysyams-wayback
  cancel-in-progress: false

jobs:
  restore:
    name: Recover June 2026 WordPress archive
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore archived website, articles, and assets
        run: |
          python3 scripts/restore_wayback.py \
            --snapshot 20260611235959 \
            --workers "${{ github.event.inputs.workers || '14' }}" \
            --attempts 4

      - name: Validate the restored website
        run: |
          test -s index.html
          test -s sitemap.xml
          test -s content/articles.json
          python3 -c 'import json,pathlib; m=json.loads(pathlib.Path("_archive/manifest.json").read_text()); print(json.dumps(m["summary"], indent=2)); assert m["summary"]["restored_html"] >= 500, "Too few archived HTML pages recovered"; assert m["summary"]["article_count"] >= 400, "Too few articles recovered"'

      - name: Commit the recovered website to main
        run: |
          git config user.name "Asy-Syams Archive Recovery"
          git config user.email "adnanyogi88@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The archived website is already up to date."
            exit 0
          fi
          git commit -m "Restore Asy-Syams website, articles, and assets from June 2026 archive"
          git push origin HEAD:main
