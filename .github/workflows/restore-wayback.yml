name: Restore archived Asy-Syams website

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-wayback.yml
      - scripts/restore_wayback.py
  workflow_dispatch:
    inputs:
      workers:
        description: Number of simultaneous Wayback downloads
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: restore-asysyams-wayback
  cancel-in-progress: false

jobs:
  restore:
    name: Recover June 2026 WordPress archive
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install a persistent HTTP client
        run: python3 -m pip install --disable-pip-version-check --quiet 'requests>=2.32,<3'

      - name: Publish homepage and core school pages immediately
        run: |
          git config user.name "Asy-Syams Archive Recovery"
          git config user.email "adnanyogi88@gmail.com"
          python3 scripts/restore_wayback.py \
            --snapshot 20260611235959 \
            --workers 4 \
            --attempts 6 \
            --limit 40
          test -s index.html
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish restored Asy-Syams homepage and core school pages"
            git push origin HEAD:main
          fi

      - name: Restore and publish archived website incrementally
        run: |
          git config user.name "Asy-Syams Archive Recovery"
          git config user.email "adnanyogi88@gmail.com"

          for pass in 1 2 3 4; do
            echo "Starting recovery pass ${pass}/4"
            python3 scripts/restore_wayback.py \
              --snapshot 20260611235959 \
              --workers "${{ github.event.inputs.workers || '6' }}" \
              --attempts 6

            test -s index.html
            test -s content/articles.json
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Restore archived Asy-Syams website and articles (recovery pass ${pass})"
              git push origin HEAD:main
            fi

            remaining=$(python3 -c 'import json,pathlib; print(json.loads(pathlib.Path("_archive/manifest.json").read_text())["summary"]["failed_resources"])')
            echo "Resources still missing after pass ${pass}: ${remaining}"
            if [ "${remaining}" -eq 0 ]; then
              break
            fi
          done

      - name: Validate the restored website
        run: |
          test -s index.html
          test -s sitemap.xml
          test -s content/articles.json
          python3 -c 'import json,pathlib; m=json.loads(pathlib.Path("_archive/manifest.json").read_text()); print(json.dumps(m["summary"], indent=2)); assert m["summary"]["restored_html"] >= 500, "Too few archived HTML pages recovered"; assert m["summary"]["article_count"] >= 400, "Too few articles recovered"'
